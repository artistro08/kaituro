<!-- Google Messages' 2026 Android launcher icon (messages.android_20261030_00_RC00 beta): the adaptive icon's colored
     foreground (its 432 px layer, embedded) clipped to the shapes of its monochrome vector (Messages-mono.svg), placed
     1.25 times larger as the colored layer draws them. The edges are the vector's, so they stay sharp at any size; the
     gradients and shading are Google's own. Solid fills under the picture keep its soft edge pixels from showing.
     Made by hand from the APK; the view box is the logo's square with a little room around it -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="26.85 28.75 54.5 54.5">
    <defs>
        <clipPath id="shapes">
