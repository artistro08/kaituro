            <path transform="matrix(1.25 0 0 1.25 -13.5 -11.525)" d="M61.78,40.40 L49.17,40.40 C44.96,40.51 41.01,42.83 38.98,46.36 C35.55,51.74 37.30,59.66 42.77,63.06 C42.77,63.06 55.45,71.35 55.45,71.35 C56.35,71.96 57.65,71.31 57.64,70.16 L57.64,64.99 C57.64,64.99 61.78,64.99 61.78,64.99 C78.07,64.34 78.08,41.06 61.78,40.41 L61.78,40.40 Z" />
        </clipPath>
    </defs>

    <!-- Under: The Two Bubbles In Their Main Colors -->
    <path transform="matrix(1.25 0 0 1.25 -13.5 -11.525)" fill="#336EF3" d="M34,48.42 A12,12 0 0 1 46,36.42 L58.79,36.42 A12,12 0 0 1 58.79,60.42 L46,60.42 A12,12 0 0 1 34,48.42 Z" />
    <path transform="matrix(1.25 0 0 1.25 -13.5 -11.525)" fill="#5490FF" d="M61.78,40.40 L49.17,40.40 C44.96,40.51 41.01,42.83 38.98,46.36 C35.55,51.74 37.30,59.66 42.77,63.06 C42.77,63.06 55.45,71.35 55.45,71.35 C56.35,71.96 57.65,71.31 57.64,70.16 L57.64,64.99 C57.64,64.99 61.78,64.99 61.78,64.99 C78.07,64.34 78.08,41.06 61.78,40.41 L61.78,40.40 Z" />

    <!-- Google's Colored Layer, Inside The Shapes -->
